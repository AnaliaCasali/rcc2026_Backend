spring.application.name=rcc2026_backend
# Lee el archivo .env de la raíz del proyecto al correr local (en Docker llegan como variables de entorno)
spring.config.import=optional:file:.env[.properties]

#configuracion de la base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rcc}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Clave secreta para firmar el JWT (mínimo 256 bits = 32 caracteres)
# Se define en .env (JWT_SECRET). NUNCA hardcodear!
app.security.jwt.secret=${JWT_SECRET}

# Tiempo de expiración en milisegundos (86400000 = 24 horas)
app.security.jwt.expiration=${JWT_EXPIRATION:86400000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
