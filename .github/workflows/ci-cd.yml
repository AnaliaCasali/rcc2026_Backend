name: RCC Backend CI Pipeline (Build & Test)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # MySQL para los tests que no usan Testcontainers (contextLoads)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: rcc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # 1. Descargar el código fuente
      - name: Checkout del código
        uses: actions/checkout@v5

      # 2. Configurar Java 25
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 3. Compatibilidad de Testcontainers 1.x con el Docker del runner
      - name: Configurar API de Docker para Testcontainers
        run: echo "api.version=1.44" > ~/.docker-java.properties

      # 4. Compilar, ejecutar todos los tests y generar cobertura
      - name: Compilar y testear con Maven
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: rcc
          DB_USERNAME: root
          DB_PASSWORD: ci_root
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-de-al-menos-32-caracteres-xx' }}
          MAIL_USERNAME: ci@example.com
          MAIL_PASSWORD: ci_dummy
          JPA_SHOW_SQL: false
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      # 4b. Guardar el reporte de JaCoCo
      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # 5. Crear el .env que pide docker-compose.yml
      - name: Generar .env para CI
        env:
          DB_PASS: ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          DB_PASS="${DB_PASS:-$(openssl rand -hex 16)}"
          JWT_SECRET="${JWT_SECRET:-$(openssl rand -base64 48)}"
          MAIL_PASSWORD="${MAIL_PASSWORD:-ci_dummy}"
          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$JWT_SECRET"
          cat > .env <<ENV
          DB_HOST=localhost
          DB_PORT=3306
          DB_NAME=rcc
          DB_USERNAME=root
          DB_PASSWORD=${DB_PASS}
          DB_HOST_PORT=3307
          JPA_DDL_AUTO=update
          JPA_SHOW_SQL=false
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRATION=86400000
          MAIL_HOST=smtp.gmail.com
          MAIL_PORT=587
          MAIL_USERNAME=ci@example.com
          MAIL_PASSWORD=${MAIL_PASSWORD}
          APP_PORT=8080
          ENV
          sed -i 's/^[[:space:]]*//' .env

      # 6. Levantar MySQL + backend con Docker Compose
      - name: Construir y levantar servicios
        run: docker compose up -d --build

      # 7. Prueba de humo: hasta 3 minutos
      - name: Prueba de humo (HTTP)
        run: |
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:8080/api/v1/localidades > /dev/null; then
              echo "✅ La aplicación responde (intento $i)."
              exit 0
            fi
            echo "Esperando a la aplicación... ($i/36)"
            sleep 5
          done
          echo "❌ La aplicación no respondió en el puerto 8080."
          exit 1

      - name: Logs de los contenedores (si falla)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=200 || true

      - name: Bajar servicios
        if: always()
        run: docker compose down -v || true
