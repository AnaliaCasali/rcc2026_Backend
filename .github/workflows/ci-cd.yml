name: RCC Backend CI Pipeline (Build & Test)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Descargar el código fuente
      - name: Checkout del código
        uses: actions/checkout@v5

      # 2. Configurar Java 25 (misma versión que pom.xml y Dockerfile)
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 3. Compilar y empaquetar (los tests no se ejecutan en este pipeline)
      - name: Compilar y empaquetar con Maven
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify
      # 3b. Guardar el reporte de JaCoCo
      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
      # 4. Crear el .env que pide docker-compose.yml (en CI no existe porque está en .gitignore).
      #    Usa los secrets del repo si existen; si no, valores de prueba generados al vuelo.
      - name: Generar .env para CI
        env:
          DB_PASS: ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          DB_PASS="${DB_PASS:-$(openssl rand -hex 16)}"
          JWT_SECRET="${JWT_SECRET:-$(openssl rand -base64 48)}"
          MAIL_PASSWORD="${MAIL_PASSWORD:-ci_dummy}"
          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$JWT_SECRET"
          cat > .env <<ENV
          DB_HOST=localhost
          DB_PORT=3306
          DB_NAME=rcc
          DB_USERNAME=root
          DB_PASSWORD=${DB_PASS}
          DB_HOST_PORT=3307
          JPA_DDL_AUTO=update
          JPA_SHOW_SQL=false
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRATION=86400000
          MAIL_HOST=smtp.gmail.com
          MAIL_PORT=587
          MAIL_USERNAME=ci@example.com
          MAIL_PASSWORD=${MAIL_PASSWORD}
          APP_PORT=8080
          ENV
          # Quitar la sangría que agrega el bloque YAML
          sed -i 's/^[[:space:]]*//' .env

      # 5. Levantar MySQL + backend con Docker Compose
      - name: Construir y levantar servicios
        run: docker compose up -d --build

      # 6. Prueba de humo: esperar hasta 3 minutos a que responda el endpoint público
      - name: Prueba de humo (HTTP)
        run: |
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:8080/api/v1/localidades > /dev/null; then
              echo "✅ La aplicación responde (intento $i)."
              exit 0
            fi
            echo "Esperando a la aplicación... ($i/36)"
            sleep 5
          done
          echo "❌ La aplicación no respondió en el puerto 8080."
          exit 1

      - name: Logs de los contenedores (si falla)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=200

      - name: Bajar servicios
        if: always()
        run: docker compose down -v
