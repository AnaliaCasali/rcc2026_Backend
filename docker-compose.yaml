version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: rcc_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: rcc
    ports:
      - "3306:3306"
    # El healthcheck ayuda a garantizar que MySQL esté realmente listo antes de iniciar Spring Boot
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: .
    container_name: rcc_backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/rcc?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APP_SECURITY_JWT_SECRET=${JWT_SECRET}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
    volumes:
      # Mapeo vital para retener las fotos subidas si el contenedor se apaga
      - ./uploads:/app/uploads

volumes:
  db_data: