services:
  db:
    image: mysql:8.4
    container_name: rcc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: rcc-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db          # dentro de la red de Docker, MySQL se llama "db"
      DB_PORT: 3306
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Mapeo vital para retener las fotos subidas si el contenedor se apaga
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:




